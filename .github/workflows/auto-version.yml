name: Auto Version and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
        - auto
        - major
        - minor
        - patch
        - build

jobs:
  auto-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.version_type
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for version detection
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Auto-detect version bump
      id: version
      run: |
        # Determine version bump type
        if [ "${{ github.event.inputs.version_type }}" != "" ]; then
          VERSION_TYPE="${{ github.event.inputs.version_type }}"
        else
          # Auto-detect based on commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log --oneline "$LAST_TAG"..HEAD)
          
          if echo "$COMMITS" | grep -q "BREAKING CHANGE\|!:"; then
            VERSION_TYPE="major"
          elif echo "$COMMITS" | grep -q "feat:"; then
            VERSION_TYPE="minor"
          elif echo "$COMMITS" | grep -q "fix:\|docs:\|style:\|refactor:\|perf:\|test:\|chore:"; then
            VERSION_TYPE="patch"
          else
            VERSION_TYPE="patch"
          fi
        fi
        
        echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
        
        # Get current version
        CURRENT_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        
        # Parse version components
        IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$CURRENT_VERSION"
        
        # Bump version
        case "$VERSION_TYPE" in
          "major")
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUILD=""
            ;;
          "minor")
            MINOR=$((MINOR + 1))
            PATCH=0
            BUILD=""
            ;;
          "patch")
            PATCH=$((PATCH + 1))
            BUILD=""
            ;;
          "build")
            if [ -z "$BUILD" ]; then
              BUILD=1
            else
              BUILD=$((BUILD + 1))
            fi
            ;;
        esac
        
        # Create new version
        if [ -z "$BUILD" ]; then
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        else
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
        fi
        
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=v$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Update version files
      run: |
        NEW_VERSION="${{ steps.version.outputs.new_version }}"
        
        # Update VERSION file
        echo "$NEW_VERSION" > VERSION
        
        # Update download.py
        sed -i "s/__GONEONIZE_VERSION__ = \".*\"/__GONEONIZE_VERSION__ = \"$NEW_VERSION\"/" neonize/download.py
        
        # Update pyproject.toml if it exists
        if [ -f "pyproject.toml" ]; then
          sed -i "s/version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
        fi
        
        echo "✅ Updated version to $NEW_VERSION"
    
    - name: Commit version changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]" || exit 0
    
    - name: Create and push tag
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        git tag "$TAG_NAME"
        git push origin "$TAG_NAME"
        echo "✅ Created tag: $TAG_NAME"
    
    - name: Push version changes
      run: |
        git push origin HEAD:${{ github.ref_name }}

  build-and-release:
    runs-on: ubuntu-latest
    needs: auto-version
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || pip install -e .
        
    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf mingw-w64
        
    - name: Build for all platforms
      run: |
        chmod +x build_all_platforms.sh
        ./build_all_platforms.sh
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/v${{ needs.auto-version.outputs.new_version }}/download/*.so
          releases/v${{ needs.auto-version.outputs.new_version }}/download/*.dll
        body: |
          # Neonize ${{ needs.auto-version.outputs.tag_name }}
          
          ## What's New
          - Compiled binaries for multiple platforms
          - Automatic versioning and release management
          
          ## Supported Platforms
          - Linux AMD64
          - Linux ARM64
          - Linux ARM
          - Windows AMD64
          - Windows ARM64
          - Windows 386
          
          ## Installation
          ```bash
          pip install git+https://github.com/fabiosouzajr/neonize-mod.git@${{ needs.auto-version.outputs.tag_name }}
          ```
          
          ## Build Information
          See the attached version.info file for build details.
          
          ## Changes
          - Multi-platform binary support
          - Improved build system
          - Automatic dependency management
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
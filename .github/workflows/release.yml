name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || pip install -e .
        
    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf mingw-w64
        
    - name: Build for all platforms
      run: |
        chmod +x build_all_platforms.sh
        ./build_all_platforms.sh
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/v${{ github.ref_name }}/download/*.so
          releases/v${{ github.ref_name }}/download/*.dll
        body: |
          # Neonize ${{ github.ref_name }}
          
          ## What's New
          - Compiled binaries for multiple platforms
          - Automatic versioning and release management
          
          ## Supported Platforms
          - Linux AMD64
          - Linux ARM64
          - Linux ARM
          - Windows AMD64
          - Windows ARM64
          - Windows 386
          
          ## Installation
          ```bash
          pip install git+https://github.com/fabiosouzajr/neonize-mod.git@${{ github.ref_name }}
          ```
          
          ## Build Information
          See the attached version.info file for build details.
          
          ## Changes
          - Multi-platform binary support
          - Improved build system
          - Automatic dependency management
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
